; Ajustes de PHP do NutriBalance em producao.
; Carregado como conf.d/nutribalance.ini, entao sobrescreve o php.ini padrao
; da imagem. Nao afeta o XAMPP local — la vale o php.ini do proprio XAMPP.

; O api/foto.php aceita imagem de ate 3 MB (TAMANHO_MAX), mas o padrao do PHP
; e 2 MB. Sem esta linha o servidor recusaria uma foto de 2,5 MB antes de o
; nosso codigo ser chamado, e o usuario veria a mensagem generica de falha.
upload_max_filesize = 4M
; post_max_size precisa ser maior que o upload: ele cobre o arquivo mais o
; resto do formulario.
post_max_size = 8M

; O dominio publico e HTTPS, entao o cookie de sessao nao tem motivo para
; trafegar em claro nem para ficar legivel pelo JavaScript da pagina.
session.cookie_secure = 1
session.cookie_httponly = 1
; Lax basta: o navegador so conversa com o dominio do Netlify, que repassa as
; chamadas para ca. Do ponto de vista dele, tudo e mesma origem.
session.cookie_samesite = Lax

; Erro nunca vai para a tela: as respostas sao JSON, e um aviso do PHP no meio
; quebraria o parse no front alem de vazar caminho de arquivo do servidor.
display_errors = Off
log_errors = On
error_log = /dev/stderr
