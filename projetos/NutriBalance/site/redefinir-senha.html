<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nova senha — NutriBalance</title>
  <link rel="icon" type="image/png" href="img/logo2.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/acesso.css" />
</head>
<body>
  <div class="acesso-pagina">
    <div class="acesso-card">
      <img class="acesso-logo" src="img/logo2.png" alt="NutriBalance" />
      <h1 class="acesso-titulo">Nova senha</h1>
      <p class="acesso-subtitulo">Escolha a senha que você vai usar para entrar.</p>

      <form id="redefinir-form" class="acesso-form">
        <label>
          Nova senha
          <div class="campo-senha">
            <input type="password" id="redefinir-senha" autocomplete="new-password"
                   minlength="6" required />
            <button type="button" class="olho-btn" data-olho="redefinir-senha"
                    aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha">
              <svg class="olho-mostrar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z" />
                <circle cx="12" cy="12" r="3.2" />
              </svg>
              <svg class="olho-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3 21 21" />
                <path d="M10.6 6.1A10 10 0 0 1 12 6c7 0 10.5 6 10.5 6a17 17 0 0 1-3.6 4.2" />
                <path d="M6.2 7.9A17 17 0 0 0 1.5 12S5 18 12 18a10 10 0 0 0 3.5-.6" />
              </svg>
            </button>
          </div>
        </label>
        <label>
          Repita a nova senha
          <div class="campo-senha">
            <input type="password" id="redefinir-confirmacao" autocomplete="new-password"
                   minlength="6" required />
            <button type="button" class="olho-btn" data-olho="redefinir-confirmacao"
                    aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha">
              <svg class="olho-mostrar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z" />
                <circle cx="12" cy="12" r="3.2" />
              </svg>
              <svg class="olho-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3 21 21" />
                <path d="M10.6 6.1A10 10 0 0 1 12 6c7 0 10.5 6 10.5 6a17 17 0 0 1-3.6 4.2" />
                <path d="M6.2 7.9A17 17 0 0 0 1.5 12S5 18 12 18a10 10 0 0 0 3.5-.6" />
              </svg>
            </button>
          </div>
        </label>
        <p class="acesso-dica">Mínimo de 6 caracteres.</p>
        <button type="submit" class="btn-primario" id="redefinir-enviar">Salvar nova senha</button>
      </form>

      <!-- O aviso de erro fica FORA do <form> de propósito: quando o link é
           inválido o formulário inteiro é escondido, e a mensagem precisa
           continuar visível para explicar o motivo. -->
      <p class="acesso-erro acesso-aviso-solto" id="redefinir-erro" hidden></p>

      <p class="acesso-ok acesso-aviso-solto" id="redefinir-ok" hidden>
        Senha alterada. Redirecionando para a tela de login…
      </p>

      <p class="acesso-troca">
        <a href="login.html">Voltar para o login</a>
      </p>
    </div>
  </div>

  <script type="module">
    import "./js/travas.js";
    import { tratarRedefinirSenha } from "./js/auth.js";
    import { ligarOlhosDeSenha } from "./js/senha.js";

    ligarOlhosDeSenha();

    // Sem token na URL não há o que redefinir: esconde o formulário e manda
    // a pessoa pedir um link novo, em vez de deixar preencher à toa.
    const temToken = new URLSearchParams(window.location.search).has("token");
    if (temToken) {
      document.getElementById("redefinir-form").addEventListener("submit", tratarRedefinirSenha);
    } else {
      document.getElementById("redefinir-form").hidden = true;
      const erro = document.getElementById("redefinir-erro");
      erro.textContent = "Link inválido. Abra o link que enviamos por e-mail ou peça um novo.";
      erro.hidden = false;
    }
  </script>
</body>
</html>
