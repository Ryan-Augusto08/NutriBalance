<title>Pátio Seminovos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#E9ECEE;
  --surface:#FFFFFF;
  --surface-2:#F3F5F6;
  --line:#D4DADE;
  --line-soft:#E3E8EA;
  --ink:#111A21;
  --ink-2:#42535F;
  --ink-3:#6B7C88;
  --acao:#16607D;
  --acao-soft:#E1EDF2;
  --alerta:#A9601A;
  --alerta-soft:#F6EADC;
  --margem:#2C6B4C;
  --margem-soft:#E2EEE8;
  --perda:#9E3128;
  --perda-soft:#F6E5E3;
  --sombra:0 1px 2px rgba(17,26,33,.06), 0 1px 1px rgba(17,26,33,.04);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1318;
    --surface:#151E25;
    --surface-2:#1B262E;
    --line:#2A3841;
    --line-soft:#222E36;
    --ink:#E7ECEF;
    --ink-2:#A9B8C2;
    --ink-3:#7D8D99;
    --acao:#5FAECC;
    --acao-soft:#16323E;
    --alerta:#DFA664;
    --alerta-soft:#332616;
    --margem:#6EB994;
    --margem-soft:#173026;
    --perda:#DE8079;
    --perda-soft:#33201E;
    --sombra:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1318;
  --surface:#151E25;
  --surface-2:#1B262E;
  --line:#2A3841;
  --line-soft:#222E36;
  --ink:#E7ECEF;
  --ink-2:#A9B8C2;
  --ink-3:#7D8D99;
  --acao:#5FAECC;
  --acao-soft:#16323E;
  --alerta:#DFA664;
  --alerta-soft:#332616;
  --margem:#6EB994;
  --margem-soft:#173026;
  --perda:#DE8079;
  --perda-soft:#33201E;
  --sombra:0 1px 2px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
.num{font-family:"IBM Plex Mono","SFMono-Regular",monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acao);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- shell ---------- */
.app{max-width:1080px;margin:0 auto;padding:0 0 64px}
.topo{
  position:sticky;top:0;z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topo-in{
  max-width:1080px;margin:0 auto;padding:14px 18px 0;
  display:flex;flex-direction:column;gap:12px;
}
.marca{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.marca-logo{
  width:30px;height:30px;border-radius:7px;background:var(--acao);
  display:grid;place-items:center;color:var(--surface);flex:none;
}
.marca-nome{font-family:Archivo;font-weight:700;font-size:17px;letter-spacing:-.02em}
.marca-sub{font-size:12px;color:var(--ink-3)}
.selo{
  margin-left:auto;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;color:var(--alerta);background:var(--alerta-soft);
  border:1px solid color-mix(in srgb, var(--alerta) 28%, transparent);
  padding:3px 8px;border-radius:99px;white-space:nowrap;
}
.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{
  padding:9px 13px 11px;font-size:14px;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.aba[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acao);font-weight:600}
.aba:hover{color:var(--ink-2)}

.tela{padding:18px}
.tela[hidden]{display:none}
.secao{margin-bottom:26px}
.secao-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.secao-cab h2{font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.secao-cab .cont{font-size:12px;color:var(--ink-3);margin-left:auto}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 14px 14px;box-shadow:var(--sombra);
}
.kpi-rot{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;display:block;margin-bottom:5px}
.kpi-val{font-family:Archivo;font-weight:700;font-size:23px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-val .pre{font-size:13px;font-weight:600;color:var(--ink-3);margin-right:2px}
.kpi-pe{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.kpi-pe strong{color:var(--margem);font-weight:600}
.kpi.destaque{border-color:color-mix(in srgb, var(--acao) 35%, transparent);background:var(--acao-soft)}

/* ---------- grafico ---------- */
.card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--sombra);padding:15px 16px 12px;
}
.grafico-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.grafico-cab h3{font-size:14.5px;font-weight:600}
.grafico-cab span{font-size:11.5px;color:var(--ink-3)}
.grafico-wrap{overflow-x:auto}
.grafico{display:block;width:100%;min-width:300px;height:150px}
.gr-linha{stroke:var(--line-soft);stroke-width:1}
.gr-base{stroke:var(--line);stroke-width:1}
.gr-barra{fill:var(--acao);opacity:.82;transition:opacity .12s}
.gr-barra.atual{opacity:1}
.gr-slot:hover .gr-barra{opacity:1}
.gr-hit{fill:transparent}
.gr-rot{font-size:11px;fill:var(--ink-3);text-anchor:middle;font-family:"IBM Plex Sans",sans-serif}
.gr-val{font-size:12px;fill:var(--ink-2);text-anchor:middle;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.gr-val.atual{fill:var(--ink);font-weight:600}
.gr-slot:focus-visible{outline:none}
.gr-slot:focus-visible .gr-barra{opacity:1;stroke:var(--ink);stroke-width:1.5}

/* ---------- alertas ---------- */
.alertas{display:grid;gap:9px}
@media (min-width:760px){.alertas{grid-template-columns:1fr 1fr}}
.alerta{
  background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--alerta);
  border-radius:var(--r);padding:12px 14px;box-shadow:var(--sombra);
}
.alerta.frio{border-left-color:var(--acao)}
.alerta-tit{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.alerta-tit .qtd{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--ink-2);
}
.alerta ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.alerta li{font-size:13px;color:var(--ink-2);display:flex;gap:8px}
.alerta li .dado{margin-left:auto;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:nowrap}

/* ---------- lista de carros ---------- */
.filtros{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filtros::-webkit-scrollbar{display:none}
.chip{
  font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.carros{display:grid;gap:10px}
@media (min-width:760px){.carros{grid-template-columns:1fr 1fr}}
.carro{
  display:flex;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:11px;box-shadow:var(--sombra);transition:border-color .12s,transform .12s;
}
.carro:hover{border-color:var(--acao)}
.carro:active{transform:scale(.995)}
.foto{
  width:78px;height:62px;flex:none;border-radius:7px;background:var(--surface-2);
  border:1px solid var(--line-soft);display:grid;place-items:center;color:var(--ink-3);
}
.foto svg{width:52px;height:auto}
.carro-corpo{min-width:0;flex:1}
.carro-tit{display:block;font-size:14.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.carro-ver{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.carro-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;font-size:12px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.carro-pe{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.preco{font-family:Archivo;font-weight:700;font-size:16px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;border:1px solid transparent;white-space:nowrap;
}
.pill.disponivel{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.pill.reservado{background:var(--acao-soft);color:var(--acao);border-color:color-mix(in srgb,var(--acao) 30%,transparent)}
.pill.consignado{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.pill.encalhado{background:var(--alerta-soft);color:var(--alerta);border-color:color-mix(in srgb,var(--alerta) 30%,transparent)}
.pill.vendido{background:var(--margem-soft);color:var(--margem);border-color:color-mix(in srgb,var(--margem) 30%,transparent)}
.pill.perdido{background:var(--perda-soft);color:var(--perda);border-color:color-mix(in srgb,var(--perda) 30%,transparent)}
.tag-int{
  margin-left:auto;font-size:11.5px;color:var(--acao);font-weight:600;
  display:flex;align-items:center;gap:4px;
}

/* ---------- funil ---------- */
.funil{display:grid;gap:14px}
@media (min-width:760px){.funil{grid-template-columns:repeat(2,1fr)}}
.coluna{display:grid;gap:18px;align-content:start}
.etapa-cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.etapa-nome{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.barra-etapa{flex:1;height:4px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.barra-etapa i{display:block;height:100%;background:var(--acao);border-radius:2px}
.etapa-qtd{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.leads{display:grid;gap:7px}
.lead{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;
  padding:10px 12px;box-shadow:var(--sombra);
}
.lead-topo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lead-nome{font-size:14px;font-weight:600}
.lead-quando{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.lead-quando.frio{color:var(--alerta);font-weight:500}
.lead-carro{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.lead-nota{font-size:12.5px;color:var(--ink-3);margin-top:5px;font-style:italic}

/* ---------- vendas ---------- */
.tabela-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line-soft)}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
th.n,td.n{text-align:right}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td .sub{display:block;font-size:11.5px;color:var(--ink-3)}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:none}
.troca{color:var(--acao);font-weight:600}

/* ---------- ficha ---------- */
.veu{
  position:fixed;inset:0;z-index:60;background:rgba(10,16,20,.55);
  display:flex;align-items:flex-end;justify-content:center;
}
.veu[hidden]{display:none}
@media (min-width:700px){.veu{align-items:center;padding:24px}}
.ficha{
  background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:14px 14px 0 0;border:1px solid var(--line);padding:16px 18px 24px;
  animation:sobe .18s ease-out;
}
@media (min-width:700px){.ficha{border-radius:14px}}
@keyframes sobe{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ficha{animation:none}}
.ficha-topo{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ficha-topo h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.ficha-topo p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.fechar{
  margin-left:auto;flex:none;width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line);color:var(--ink-2);display:grid;place-items:center;font-size:17px;line-height:1;
}
.fechar:hover{background:var(--surface-2)}
.especs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin:0 0 16px}
@media (min-width:520px){.especs{grid-template-columns:repeat(4,1fr)}}
.espec{background:var(--surface);padding:9px 11px}
.espec dt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.espec dd{margin:2px 0 0;font-size:13.5px;font-family:"IBM Plex Mono",monospace;font-weight:500}
.bloco-tit{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 8px}
.contas{border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-bottom:16px}
.conta{display:flex;align-items:baseline;gap:10px;padding:8px 12px;font-size:13.5px;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.conta:last-child{border-bottom:none}
.conta .v{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.conta .d{color:var(--ink-3);font-size:12.5px}
.conta.total{background:var(--surface-2);font-weight:600}
.conta.total .v{color:var(--margem)}
.conta.saida .v{color:var(--ink-2)}
.aviso{font-size:12.5px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--line-soft);padding-top:12px;margin:4px 0 0}

.rodape{
  max-width:1080px;margin:0 auto;padding:22px 18px 0;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);line-height:1.55;
}
.rodape strong{color:var(--ink-2);font-weight:600}
</style>

<div class="app">
  <header class="topo">
    <div class="topo-in">
      <div class="marca">
        <span class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 60 24" width="20" fill="currentColor"><path d="M6 18h3.2a5.6 5.6 0 0 1 11.2 0h18a5.6 5.6 0 0 1 11.2 0H53a2 2 0 0 0 2-2v-3.1c0-1.3-.9-2.4-2.1-2.7L44 8.4l-5.4-4.5A4.4 4.4 0 0 0 35.8 3H21.4c-1.1 0-2.1.4-2.9 1.1L13.4 9l-6.5 1.5A3.2 3.2 0 0 0 4 13.6V16a2 2 0 0 0 2 2z"/></svg>
        </span>
        <div>
          <div class="marca-nome">Garagem Modelo</div>
          <div class="marca-sub">agosto 2026 · atualizado às 09:12</div>
        </div>
        <span class="selo">Protótipo · dados fictícios</span>
      </div>
      <nav class="abas" role="tablist" aria-label="Áreas do sistema">
        <button class="aba" role="tab" aria-selected="true" data-tela="painel">Painel</button>
        <button class="aba" role="tab" aria-selected="false" data-tela="estoque">Estoque</button>
        <button class="aba" role="tab" aria-selected="false" data-tela="funil">Interessados</button>
        <button class="aba" role="tab" aria-selected="false" data-tela="vendas">Vendas</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="tela" id="tela-painel" role="tabpanel" aria-label="Painel"></section>
    <section class="tela" id="tela-estoque" role="tabpanel" aria-label="Estoque" hidden></section>
    <section class="tela" id="tela-funil" role="tabpanel" aria-label="Interessados" hidden></section>
    <section class="tela" id="tela-vendas" role="tabpanel" aria-label="Vendas" hidden></section>
  </main>

  <footer class="rodape">
    <p><strong>Isto é um protótipo.</strong> Nenhuma loja, pessoa, placa ou venda aqui é real — os dados existem só para mostrar como o sistema se comportaria num pátio de porte médio. Nada é salvo.</p>
  </footer>
</div>

<div class="veu" id="veu" hidden>
  <div class="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-tit" id="ficha"></div>
</div>

const custoTotal = c => c.custos.reduce((s,par) => s + par[1], 0);

const silhueta = '<svg viewBox="0 0 60 24" fill="currentColor" aria-hidden="true"><path opacity=".5" d="M6 18h3.2a5.6 5.6 0 0 1 11.2 0h18a5.6 5.6 0 0 1 11.2 0H53a2 2 0 0 0 2-2v-3.1c0-1.3-.9-2.4-2.1-2.7L44 8.4l-5.4-4.5A4.4 4.4 0 0 0 35.8 3H21.4c-1.1 0-2.1.4-2.9 1.1L13.4 9l-6.5 1.5A3.2 3.2 0 0 0 4 13.6V16a2 2 0 0 0 2 2z"/></svg>';

/* ---------------- gráfico ---------------- */
function grafico(serie){
  const W = 560, H = 150, padL = 8, padR = 8, padT = 26, padB = 26;
  const max = Math.max.apply(null, serie.map(d => d.qtd));
  const util = H - padT - padB;
  const slot = (W - padL - padR) / serie.length;
  const bw = Math.min(46, slot - 14);
  const y = v => padT + util - (v / max) * util;
  const path = (x, yy, w, h, r) => {
    r = Math.min(r, h, w / 2);
    return 'M' + x + ',' + (yy + h) + ' L' + x + ',' + (yy + r) +
           ' Q' + x + ',' + yy + ' ' + (x + r) + ',' + yy +
           ' L' + (x + w - r) + ',' + yy +
           ' Q' + (x + w) + ',' + yy + ' ' + (x + w) + ',' + (yy + r) +
           ' L' + (x + w) + ',' + (yy + h) + ' Z';
  };
  let g = '';
  [0, 0.5, 1].forEach(f => {
    const yy = padT + util - f * util;
    g += '<line class="' + (f === 0 ? 'gr-base' : 'gr-linha') + '" x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '"/>';
  });
  serie.forEach((d, i) => {
    const cx = padL + slot * i + slot / 2, x = cx - bw / 2, yy = y(d.qtd), h = padT + util - yy;
    g += '<g class="gr-slot" tabindex="0" role="img" aria-label="' + d.mes + ': ' + d.qtd + ' carros vendidos' + (d.atual ? ', mês em curso' : '') + '">' +
      '<rect class="gr-hit" x="' + (padL + slot * i) + '" y="' + (padT - 10) + '" width="' + slot + '" height="' + (util + 20) + '">' +
        '<title>' + d.mes + ' · ' + d.qtd + ' carros' + (d.atual ? ' (parcial)' : '') + '</title></rect>' +
      '<path class="gr-barra' + (d.atual ? ' atual' : '') + '" d="' + path(x, yy, bw, h, 4) + '"/>' +
      '<text class="gr-val' + (d.atual ? ' atual' : '') + '" x="' + cx + '" y="' + (yy - 7) + '">' + d.qtd + '</text>' +
      '<text class="gr-rot" x="' + cx + '" y="' + (H - 8) + '">' + d.mes + (d.atual ? '*' : '') + '</text>' +
    '</g>';
  });
  return '<svg class="grafico" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Carros vendidos por mês, de março a agosto de 2026">' + g + '</svg>';
}

/* ---------------- estoque ---------------- */
let filtro = 'todos';
function renderEstoque(){
  const lista = carros.filter(c => {
    if (filtro === 'todos') return true;
    if (filtro === 'encalhados') return encalhado(c);
    if (filtro === 'interesse') return interessadosDe(c.id).length > 0;
    return c.status === filtro;
  });
  const chip = (v, r) => '<button class="chip" data-filtro="' + v + '" aria-pressed="' + (filtro === v) + '">' + r + '</button>';
  document.getElementById('tela-estoque').innerHTML =
    '<div class="secao-cab"><h2>Estoque</h2><span class="cont">' + lista.length + ' de ' + carros.length + ' carros</span></div>' +
    '<div class="filtros">' +
      chip('todos','Todos') + chip('disponivel','Disponíveis') + chip('reservado','Reservados') +
      chip('interesse','Com interessado') + chip('encalhados','Parados +90 dias') + chip('consignado','Consignados') +
    '</div>' +
    '<div class="carros">' + lista.map(cardCarro).join('') + '</div>';
}
function cardCarro(c){
  const ints = interessadosDe(c.id).length;
  const st = encalhado(c) ? 'encalhado' : c.status;
  const rot = {disponivel:'Disponível', reservado:'Reservado', consignado:'Consignado', encalhado: c.dias + ' dias parado'}[st];
  return '<button class="carro" data-carro="' + c.id + '">' +
    '<span class="foto">' + silhueta + '</span>' +
    '<span class="carro-corpo">' +
      '<span class="carro-tit">' + esc(c.marca + ' ' + c.modelo) + '</span>' +
      '<span class="carro-ver">' + esc(c.versao + ' · ' + c.ano) + '</span>' +
      '<span class="carro-meta"><span>' + brl(c.km) + ' km</span><span>' + esc(c.placa) + '</span><span>' + esc(c.cor) + '</span></span>' +
      '<span class="carro-pe">' +
        '<span class="preco">R$ ' + brl(c.anuncio) + '</span>' +
        '<span class="pill ' + st + '">' + rot + '</span>' +
        (ints ? '<span class="tag-int">' + ints + ' interessado' + (ints > 1 ? 's' : '') + '</span>' : '') +
      '</span>' +
    '</span>' +
  '</button>';
}

/* ---------------- ficha ---------------- */

  const linhas = c.origem === 'consignado'
    ? '<div class="conta"><span class="d">Carro de terceiro, em consignação</span><span class="v d">não é capital da loja</span></div>' +

      '<div class="conta total"><span>Comissão prevista (5%)</span><span class="v">R$ ' + brl(Math.round(c.anuncio * 0.05)) + '</span></div>'
    : '<div class="conta"><span>Compra</span><span class="v">R$ ' + brl(c.compra) + '</span></div>' +
      c.custos.map(p => '<div class="conta saida"><span class="d">' + esc(p[0]) + '</span><span class="v">+ R$ ' + brl(p[1]) + '</span></div>').join('') +
      '<div class="conta"><span>Investido no carro</span><span class="v">R$ ' + brl(c.compra + ct) + '</span></div>' +
      '<div class="conta"><span>Anunciado por</span><span class="v">R$ ' + brl(c.anuncio) + '</span></div>' +
      '<div class="conta total"><span>Margem se vender no anúncio</span><span class="v">R$ ' + brl(margemPrev(c)) + '</span></div>';

  document.getElementById('ficha').innerHTML =
    '<div class="ficha-topo">' +
      '<div><h2 id="ficha-tit">' + esc(c.marca + ' ' + c.modelo) + '</h2>' +
      '<p>' + esc(c.versao + ' · ' + c.ano + ' · ' + c.cor) + '</p></div>' +
      '<button class="fechar" id="btn-fechar" aria-label="Fechar ficha">×</button>' +
    '</div>' +
    '<dl class="especs">' +
      '<div class="espec"><dt>Placa</dt><dd>' + esc(c.placa) + '</dd></div>' +
      '<div class="espec"><dt>KM</dt><dd>' + brl(c.km) + '</dd></div>' +
      '<div class="espec"><dt>No pátio</dt><dd>' + c.dias + ' dias</dd></div>' +
      '<div class="espec"><dt>Situação</dt><dd>' + {disponivel:'Disponível', reservado:'Reservado', consignado:'Consignado'}[c.status] + '</dd></div>' +
    '</dl>' +
    '<h3 class="bloco-tit">Quanto esse carro dá</h3>' +
    '<div class="contas">' + linhas + '</div>' +
    '<h3 class="bloco-tit">Quem está interessado (' + ints.length + ')</h3>' +
    '<div class="leads">' +
      (ints.length ? ints.map(i =>
        '<div class="lead"><div class="lead-topo">' +
          '<span class="lead-nome">' + esc(i.cliente) + '</span>' +
          '<span class="pill ' + (i.dias >= DIAS_FRIO ? 'encalhado' : 'reservado') + '">' + ETAPAS[i.etapa] + '</span>' +
          '<span class="lead-quando' + (i.dias >= DIAS_FRIO ? ' frio' : '') + '">' + (i.dias === 0 ? 'hoje' : 'há ' + i.dias + 'd') + '</span>' +
        '</div><div class="lead-nota">' + esc(i.nota) + '</div></div>'
      ).join('') : '<div class="lead"><div class="lead-nota">Ninguém registrado ainda neste carro.</div></div>') +
    '</div>' +
    '<p class="aviso">Placa e telefone são dados pessoais. Num sistema em uso, só quem tem perfil de acesso enxerga esta ficha, e fica salvo o registro de quem a abriu.</p>';

  document.getElementById('veu').hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('btn-fechar').focus();
}
function fecharFicha(){
  document.getElementById('veu').hidden = true;
  document.body.style.overflow = '';
}

/* ---------------- funil ---------------- */
function renderFunil(){
  const ativos = interesses.filter(i => ATIVAS.includes(i.etapa));
  const bloco = et => {
    const lista = interesses.filter(i => i.etapa === et);
    if (!lista.length) return '';
    return '<div>' +
      '<div class="etapa-cab">' +
        '<span class="etapa-nome">' + ETAPAS[et] + '</span>' +
        '<span class="barra-etapa"><i style="width:' + Math.round(lista.length / ativos.length * 100) + '%"></i></span>' +
        '<span class="etapa-qtd">' + lista.length + '</span>' +
      '</div>' +
      '<div class="leads">' + lista.map(cardLead).join('') + '</div>' +
    '</div>';
  };
  const perdidos = interesses.filter(i => i.etapa === 'perdido');
  document.getElementById('tela-funil').innerHTML =
    '<div class="secao-cab"><h2>Quem está interessado em qual carro</h2><span class="cont">' + ativos.length + ' ativos</span></div>' +
    '<div class="funil">' +
      '<div class="coluna">' + ['negociacao','proposta'].map(bloco).join('') + '</div>' +
      '<div class="coluna">' + ['visita','contato','novo'].map(bloco).join('') + '</div>' +
    '</div>' +
    '<div class="secao" style="margin-top:24px">' +
      '<div class="secao-cab"><h2>Perdidos</h2><span class="cont">' + perdidos.length + ' este mês</span></div>' +
      '<div class="leads">' + perdidos.map(cardLead).join('') + '</div>' +
    '</div>';
}
function cardLead(i){
  const c = carroDe(i.carroId), frio = ATIVAS.includes(i.etapa) && i.dias >= DIAS_FRIO;
  return '<div class="lead">' +
    '<div class="lead-topo">' +
      '<span class="lead-nome">' + esc(i.cliente) + '</span>' +
      (i.etapa === 'perdido' ? '<span class="pill perdido">Perdido</span>' : '') +
      '<span class="lead-quando' + (frio ? ' frio' : '') + '">' + (i.dias === 0 ? 'hoje' : 'há ' + i.dias + 'd') + (frio ? ' · esfriando' : '') + '</span>' +
    '</div>' +
    '<div class="lead-carro">' + esc(c.marca + ' ' + c.modelo + ' ' + c.ano.slice(0,4)) + ' · <span class="num">R$ ' + brl(c.anuncio) + '</span></div>' +
    '<div class="lead-nota">' + esc(i.nota) + '</div>' +
  '</div>';
}

}

/* ---------------- navegação ---------------- */
function trocarTela(nome){
  document.querySelectorAll('.aba').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tela === nome)));
  document.querySelectorAll('.tela').forEach(s => { s.hidden = s.id !== 'tela-' + nome; });
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const aba = e.target.closest('.aba');
  if (aba) { trocarTela(aba.dataset.tela); return; }
  const chip = e.target.closest('.chip');
  if (chip) { filtro = chip.dataset.filtro; renderEstoque(); return; }
  const carro = e.target.closest('[data-carro]');
  if (carro) { abrirFicha(Number(carro.dataset.carro)); return; }
  if (e.target.id === 'btn-fechar' || e.target.closest('#btn-fechar') || e.target.id === 'veu') fecharFicha();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharFicha(); });

renderPainel(); renderEstoque(); renderFunil(); renderVendas();
</script>
