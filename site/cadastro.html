<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — NutriBalance</title>
  <link rel="icon" type="image/png" href="img/logo2.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <img class="auth-logo" src="img/logo.png" alt="NutriBalance" />
      <h1 class="auth-title">Criar conta</h1>
      <p class="auth-subtitle">Leva menos de um minuto.</p>

      <form id="cadastro-form" class="auth-form">
        <label>
          Nome
          <input type="text" id="cadastro-nome" autocomplete="name" required />
        </label>
        <label>
          E-mail
          <input type="email" id="cadastro-email" autocomplete="email" required />
        </label>
        <label>
          Senha
          <input type="password" id="cadastro-senha" autocomplete="new-password"
                 minlength="6" required />
        </label>
        <p class="auth-hint">Mínimo de 6 caracteres.</p>
        <p class="auth-error" id="cadastro-error" hidden></p>
        <button type="submit" class="btn-primary" id="cadastro-submit">Criar conta</button>
      </form>

      <p class="auth-switch">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    redirectIfLogged();
    document.getElementById("cadastro-form").addEventListener("submit", handleCadastro);
  </script>
</body>
</html>
