<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — NutriBalance</title>
  <link rel="icon" type="image/png" href="img/logo2.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="acesso-pagina">
    <div class="acesso-card">
      <img class="acesso-logo" src="img/logo2.png" alt="NutriBalance" />
      <h1 class="acesso-titulo">Entrar</h1>
      <p class="acesso-subtitulo">Acompanhe sua alimentação e suas metas.</p>

      <form id="login-form" class="acesso-form">
        <label>
          E-mail
          <input type="email" id="login-email" autocomplete="email" required />
        </label>
        <label>
          Senha
          <input type="password" id="login-senha" autocomplete="current-password" required />
        </label>
        <p class="acesso-erro" id="login-erro" hidden></p>
        <button type="submit" class="btn-primario" id="login-enviar">Entrar</button>
      </form>

      <p class="acesso-troca">
        Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    redirecionarSeLogado();
    document.getElementById("login-form").addEventListener("submit", tratarLogin);
  </script>
</body>
</html>
